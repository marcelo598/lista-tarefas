# Blueprint do Render: cria o serviço web (Docker) + banco PostgreSQL
services:
  - type: web
    name: lista-tarefas
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tarefas-db
          property: connectionString

databases:
  - name: tarefas-db
    plan: free
