<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>📝 Lista de Tarefas</h1>
    <p class="sub">Flask + Docker + Render</p>

    <form action="{{ url_for('adicionar') }}" method="post" class="add">
      <input type="text" name="titulo" placeholder="Nova tarefa..." maxlength="200" required autofocus>
      <button type="submit">Adicionar</button>
    </form>

    {% if tarefas %}
    <ul>
      {% for t in tarefas %}
      <li class="{{ 'done' if t.concluida }}">
        <form action="{{ url_for('concluir', id=t.id) }}" method="post">
          <button class="check" title="Concluir/Reabrir">{{ '✔' if t.concluida else '○' }}</button>
        </form>
        <span class="titulo">{{ t.titulo }}</span>
        <a class="edit" href="{{ url_for('editar', id=t.id) }}">Editar</a>
        <form action="{{ url_for('excluir', id=t.id) }}" method="post">
          <button class="del" title="Excluir">✕</button>
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="empty">Nenhuma tarefa ainda. Adicione a primeira!</p>
    {% endif %}
  </main>
</body>
</html>
